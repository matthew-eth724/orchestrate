name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The PyPI package is skills-ref; it installs the `agentskills` binary.
      - name: Install the Agent Skills reference validator
        run: pip install skills-ref

      - name: Validate with the reference implementation
        run: agentskills validate "$PWD"

      - name: Validate (repo checks)
        run: bash scripts/validate.sh
